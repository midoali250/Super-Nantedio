<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros. NES</title>
    <script src="https://cdn.jsdelivr.net/npm/jsnes@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
        }
        #screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
        }
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 42vh;
            display: flex;
            padding: 12px 8px;
            gap: 15px;
            pointer-events: none;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
        }
        #joystick-container {
            position: relative;
            width: 160px;
            height: 160px;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #joystick-base {
            width: 160px;
            height: 160px;
            background: rgba(255,255,255,0.10);
            border: 3px solid rgba(0,255,255,0.40);
            border-radius: 50%;
            position: absolute;
            top: 0; left: 0;
        }
        #joystick-knob {
            width: 66px;
            height: 66px;
            background: #00ffff;
            border: 5px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 47px; left: 47px;
            box-shadow: 0 0 30px rgba(0,255,255,0.8);
            pointer-events: none;
        }
        #joystick-touch {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
        }
        #action-buttons {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 12px;
            pointer-events: auto;
            width: 180px;
            flex-shrink: 0;
        }
        .btn-row {
            display: flex;
            gap: 12px;
        }
        .btn {
            width: 76px;
            height: 76px;
            border: none;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            position: relative;
            touch-action: none;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.4);
        }
        .btn-a { background: #ff3333; font-size: 30px; }
        .btn-b { background: #33ff33; color: #000; font-size: 24px; }
        .btn-select { background: #ff9900; font-size: 15px; padding: 0 8px; }
        .btn-start { background: #9933ff; font-size: 15px; padding: 0 8px; }
        .btn-label {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 3px 8px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }
        #loading.spinner {
            width: 60px;
            height: 60px;
            border: 7px solid #222;
            border-top: 7px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        #loading-text {
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0,255,255,0.6);
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff3333;
            font-size: 16px;
            display: none;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            padding: 24px;
            border-radius: 12px;
            border: 2px solid #ff3333;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="screen-container">
        <div id="loading">
            <div class="spinner"></div>
            <div id="loading-text">جاري تحميل لعبة سوبر ماريو…</div>
        </div>
        <div id="error-msg">
            فشل في تحميل لعبة سوبر ماريو<br>
            تأكد من تثبيت التطبيق بشكل صحيح
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <!-- Action Buttons (Right side - Atari style) -->
        <div id="action-buttons">
            <div class="btn-row">
                <div class="btn-label">قفزة كبيرة (A)</div>
                <button class="btn btn-a" id="btn-a">A</button>
                <div class="btn-label">طلقة واحدة (SELECT)</div>
                <button class="btn btn-select" id="btn-select">SHOT</button>
            </div>
            <div class="btn-row">
                <div class="btn-label">قفزة صغيرة (B)</div>
                <button class="btn btn-b" id="btn-b">B</button>
                <div class="btn-label">طلق متعدد (START)</div>
                <button class="btn btn-start" id="btn-start">RAPID</button>
            </div>
        </div>

        <!-- Joystick / D-Pad (Left side - Atari style) -->
        <div id="joystick-container">
            <div id="joystick-base"></div>
            <div id="joystick-knob"></div>
            <div id="joystick-touch"></div>
        </div>
    </div>

<script>
    var nes = null;
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { alpha: false });
    var imageData = null;
    var loadingDiv = document.getElementById('loading');
    var errorDiv = document.getElementById('error-msg');

    function resizeCanvas() {
        canvas.width = 256;
        canvas.height = 240;
    }

    function initNES() {
        nes = new JSNES({
            onFrame: function(frameBuffer) {
                if (!imageData) {
                    imageData = ctx.createImageData(256, 240);
                }
                for (var i = 0; i < 256 * 240; i++) {
                    imageData.data[i * 4 + 0] = frameBuffer[i * 3 + 0];
                    imageData.data[i * 4 + 1] = frameBuffer[i * 3 + 1];
                    imageData.data[i * 4 + 2] = frameBuffer[i * 3 + 2];
                    imageData.data[i * 4 + 3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            }
        });
    }

    function nesLoadROM() {
        loadingDiv.style.display = 'flex';
        errorDiv.style.display = 'none';

        // ROM filename EXACTLY as in the project: Super Mario Bros. + Duck Hunt (E) [!].nes
        var romFilename = 'Super%20Mario%20Bros.%20%2B%20Duck%20Hunt%20(E)%20[%21].nes';

        fetch('file:///android_asset/' + romFilename)
            .then(function(response) {
                if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                return response.arrayBuffer();
            })
            .then(function(buffer) {
                var romData = new Uint8Array(buffer);
                nes.loadROM(romData);
                loadingDiv.style.display = 'none';
                nesPlay();
            })
            .catch(function(error) {
                console.error('Error loading ROM:', error);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
            });
    }

    function nesPlay()  { if (nes) nes.play(); }
    function nesPause() { if (nes) nes.pause(); }
    function nesReset() { if (nes) { nes.reset(); nesLoadROM(); } }

    var KEY = {
        UP: JSNES.KEY_UP, DOWN: JSNES.KEY_DOWN, LEFT: JSNES.KEY_LEFT, RIGHT: JSNES.KEY_RIGHT,
        A: JSNES.KEY_A, B: JSNES.KEY_B, SELECT: JSNES.KEY_SELECT, START: JSNES.KEY_START
    };

    var activeKeys = {};
    function press(key) {
        if (!activeKeys[key]) {
            activeKeys[key] = true;
            if (nes) nes.pressKey(key);
        }
    }
    function release(key) {
        if (activeKeys[key]) {
            activeKeys[key] = false;
            if (nes) nes.releaseKey(key);
        }
    }

    function setupButton(id, key) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', function(e) { e.preventDefault(); press(key); }, {passive:false});
        el.addEventListener('touchend', function(e) { e.preventDefault(); release(key); }, {passive:false});
        el.addEventListener('touchcancel', function(e) { e.preventDefault(); release(key); }, {passive:false});
        el.addEventListener('mousedown', function(e) { e.preventDefault(); press(key); });
        el.addEventListener('mouseup', function(e) { e.preventDefault(); release(key); });
        el.addEventListener('mouseleave', function(e) { e.preventDefault(); release(key); });
    }
    setupButton('btn-a', KEY.A);
    setupButton('btn-b', KEY.B);
    setupButton('btn-select', KEY.SELECT);
    setupButton('btn-start', KEY.START);

    var joystickBase   = document.getElementById('joystick-base');
    var joystickKnob   = document.getElementById('joystick-knob');
    var joystickTouch  = document.getElementById('joystick-touch');
    var containerRect  = {cx: 80, cy: 80};
    var maxStickDist   = 60;
    var deadzone       = 16;
    var joyActive      = false;

    function getTouchPos(e) {
        var r = joystickTouch.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return {x: t.clientX - r.left, y: t.clientY - r.top};
    }

    function updateJoystick(dx, dy) {
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > maxStickDist) dist = maxStickDist;
        var nx = dx / maxStickDist;
        var ny = dy / maxStickDist;

        var kx = dx - 33, ky = dy - 33;
        if (dist > deadzone) {
            joystickKnob.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
        } else {
            joystickKnob.style.transform = 'translate(0,0)';
            nx = 0; ny = 0;
        }

        var up = false, down = false, left = false, right = false;
        if (dist > deadzone) {
            var absX = Math.abs(nx), absY = Math.abs(ny);
            if (absY > 0.35) { if (ny < 0) up = true; else down = true; }
            if (absX > 0.35) { if (nx < 0) left = true; else right = true; }
        }

        pressRelease(KEY.UP, up);
        pressRelease(KEY.DOWN, down);
        pressRelease(KEY.LEFT, left);
        pressRelease(KEY.RIGHT, right);
    }

    function pressRelease(key, state) {
        if (state) press(key); else release(key);
    }

    function endJoystick() {
        joyActive = false;
        joystickKnob.style.transform = 'translate(0,0)';
        pressRelease(KEY.UP, false);
        pressRelease(KEY.DOWN, false);
        pressRelease(KEY.LEFT, false);
        pressRelease(KEY.RIGHT, false);
    }

    joystickTouch.addEventListener('touchstart', function(e) {
        e.preventDefault();
        joyActive = true;
        var p = getTouchPos(e);
        updateJoystick(p.x - containerRect.cx, p.y - containerRect.cy);
    }, {passive:false});
    joystickTouch.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!joyActive) return;
        var p = getTouchPos(e);
        updateJoystick(p.x - containerRect.cx, p.y - containerRect.cy);
    }, {passive:false});
    joystickTouch.addEventListener('touchend', function(e) { e.preventDefault(); endJoystick(); }, {passive:false});
    joystickTouch.addEventListener('touchcancel', function(e) { e.preventDefault(); endJoystick(); }, {passive:false});

    window.addEventListener('mousedown', function(e) {
        var r = joystickTouch.getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
            joyActive = true;
            var p = getTouchPos(e);
            updateJoystick(p.x - containerRect.cx, p.y - containerRect.cy);
        }
    });
    window.addEventListener('mousemove', function(e) {
        if (!joyActive) return;
        var r = joystickTouch.getBoundingClientRect();
        updateJoystick(e.clientX - r.left - containerRect.cx, e.clientY - r.top - containerRect.cy);
    });
    window.addEventListener('mouseup', endJoystick);

    var keyMapCode = {
        'ArrowUp': KEY.UP, 'ArrowDown': KEY.DOWN, 'ArrowLeft': KEY.LEFT, 'ArrowRight': KEY.RIGHT,
        'z': KEY.A, 'x': KEY.B, 'a': KEY.SELECT, 's': KEY.START,
        'Enter': KEY.START, 'Shift': KEY.SELECT
    };
    window.addEventListener('keydown', function(e) {
        var k = keyMapCode[e.key];
        if (k) { e.preventDefault(); press(k); }
    });
    window.addEventListener('keyup', function(e) {
        var k = keyMapCode[e.key];
        if (k) { e.preventDefault(); release(k); }
    });

    window.addEventListener('DOMContentLoaded', function() {
        resizeCanvas();
        initNES();
        setTimeout(nesLoadROM, 600);
    });
    window.addEventListener('resize', resizeCanvas);
</script>

</body>
</html>
