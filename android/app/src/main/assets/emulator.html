<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bitvaultengine NES Emulator</title>
    <script src="https://cdn.jsdelivr.net/npm/jsnes@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #screen-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
        }
        #canvas {
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 65vh;
            touch-action: none;
            display: block;
        }
        #status-bar {
            padding: 8px;
            background: #16213e;
            text-align: center;
            font-size: 13px;
            color: #03dac5;
            width: 100%;
        }

        /* --- Controls Layout --- */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 35vh;
            display: flex;
            padding: 15px 10px;
            gap: 20px;
            pointer-events: none;
        }

        /* --- Joystick (Left Side) --- */
        #joystick-container {
            position: relative;
            width: 140px;
            height: 140px;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-base {
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.12);
            border: 3px solid rgba(3,218,197,0.35);
            border-radius: 50%;
            position: absolute;
            top: 0; left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-knob {
            width: 56px;
            height: 56px;
            background: #03dac5;
            border: 4px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 42px; left: 42px;
            box-shadow: 0 0 15px rgba(3,218,197,0.6);
            pointer-events: none;
            touch-action: none;
        }
        #joystick-touch {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
        }

        /* --- Action Buttons (Right Side) --- */
        #action-buttons {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 14px;
            pointer-events: auto;
            width: 140px;
        }
        .btn-row {
            display: flex;
            gap: 14px;
        }
        .btn {
            width: 64px;
            height: 64px;
            border: none;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            position: relative;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }
        .btn-a { background: #ff6b6b; }
        .btn-b { background: #4ecdc4; color: #000; }
        .btn-select { background: #ffa502; font-size: 13px; padding: 0 6px; }
        .btn-start { background: #6c5ce7; font-size: 13px; padding: 0 6px; }

        /* --- Loading Overlay --- */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 10;
        }
        #loading.spinner {
            width: 44px;
            height: 44px;
            border: 5px solid #333;
            border-top: 5px solid #03dac5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Hide joystick hints for RTL cleanliness */
        .hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #888; pointer-events: none; }
    </style>
</head>
<body>

    <div id="screen-container">
        <div id="loading" class="spinner"></div>
        <div id="loading">جاري تحميل الروم…</div>
        <canvas id="canvas" width="256" height="240"></canvas>
        <div id="status-bar">المحاكي جاهز — منتظر تحميل الروم</div>
    </div>

    <div id="controls">
        <!-- Joystick (Left) -->
        <div id="joystick-container">
            <div id="joystick-base"></div>
            <div id="joystick-knob"></div>
            <div id="joystick-touch"></div>
        </div>

        <!-- Action Buttons (Right) -->
        <div id="action-buttons">
            <div class="btn-row">
                <button class="btn btn-b" id="btn-b">B</button>
                <button class="btn btn-a" id="btn-a">A</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-select" id="btn-select">SELECT</button>
                <button class="btn btn-start" id="btn-start">START</button>
            </div>
        </div>
    </div>

<div class="hint">عصاية حركة يسار • أزرار A/B/SELECT/START يمين</div>

<script>
    /* ============ NES Core ============ */
    var nes = null;
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var imageData = null;
    var statusBar = document.getElementById('status-bar');
    var loadingDiv = document.getElementById('loading');

    function setStatus(msg) {
        statusBar.textContent = msg;
        if (window.NES) window.NES.onStatus(msg);
    }

    function initNES() {
        nes = new JSNES({
            onFrame: function(frameBuffer) {
                if (!imageData) {
                    imageData = ctx.createImageData(256, 240);
                }
                for (var i = 0; i < 256 * 240; i++) {
                    imageData.data[i * 4 + 0] = frameBuffer[i * 3 + 0];
                    imageData.data[i * 4 + 1] = frameBuffer[i * 3 + 1];
                    imageData.data[i * 4 + 2] = frameBuffer[i * 3 + 2];
                    imageData.data[i * 4 + 3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            }
        });
        setStatus('تم تهيئة المحاكي بنجاح');
    }

    /* ============ ROM Loading ============ */
    function nesLoadROM() {
        loadingDiv.style.display = 'block';
        setStatus('جاري تحميل الروم من الأصول…');

        fetch('file:///android_asset/Super%20Mario%20Bros.%20%2B%20Duck%20Hunt%20%2B%20World%20Class%20Track%20Meet%20(U)%20(PRG0)%20[!].nes')
            .then(function(response) {
                if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                return response.arrayBuffer();
            })
            .then(function(buffer) {
                var romData = new Uint8Array(buffer);
                nes.loadROM(romData);
                loadingDiv.style.display = 'none';
                setStatus('تم تحميل الروم — Super Mario Bros.');
                if (window.NES) window.NES.onROMLoaded(true);
                nesPlay();
            })
            .catch(function(error) {
                console.error('Error loading ROM:', error);
                loadingDiv.style.display = 'none';
                setStatus('فشل تحميل الروم: ' + error.message);
                if (window.NES) window.NES.onROMLoaded(false);
            });
    }

    function nesPlay()  { if (nes) { nes.play();  setStatus('التشغيل جاري…'); } }
    function nesPause() { if (nes) { nes.pause(); setStatus('متوقف مؤقتاً'); } }
    function nesReset() { if (nes) { nes.reset(); setStatus('تم إعادة التشغيل'); } }

    /* ============ Key Mapping ============ */
    var KEY = {
        UP:    JSNES.KEY_UP,
        DOWN:  JSNES.KEY_DOWN,
        LEFT:  JSNES.KEY_LEFT,
        RIGHT: JSNES.KEY_RIGHT,
        A:     JSNES.KEY_A,
        B:     JSNES.KEY_B,
        SELECT: JSNES.KEY_SELECT,
        START: JSNES.KEY_START
    };

    var activeKeys = {};

    function press(key) {
        if (!activeKeys[key]) {
            activeKeys[key] = true;
            if (nes) nes.pressKey(key);
        }
    }
    function release(key) {
        if (activeKeys[key]) {
            activeKeys[key] = false;
            if (nes) nes.releaseKey(key);
        }
    }

    /* ============ Action Buttons ============ */
    function setupButton(id, key) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', function(e) { e.preventDefault(); press(key); }, {passive:false});
        el.addEventListener('touchend',   function(e) { e.preventDefault(); release(key); }, {passive:false});
        el.addEventListener('touchcancel',function(e) { e.preventDefault(); release(key); }, {passive:false});
        el.addEventListener('mousedown',  function(e) { e.preventDefault(); press(key); });
        el.addEventListener('mouseup',    function(e) { e.preventDefault(); release(key); });
        el.addEventListener('mouseleave', function(e) { e.preventDefault(); release(key); });
    }
    setupButton('btn-a', KEY.A);
    setupButton('btn-b', KEY.B);
    setupButton('btn-select', KEY.SELECT);
    setupButton('btn-start', KEY.START);

    /* ============ Virtual Joystick ============ */
    var joystickBase   = document.getElementById('joystick-base');
    var joystickKnob   = document.getElementById('joystick-knob');
    var joystickTouch  = document.getElementById('joystick-touch');
    var containerRect  = {cx: 70, cy: 70}; // center of 140px container
    var maxStickDist   = 52; // base radius (70) - knob radius (28) - small gap
    var deadzone       = 14;
    var joyActive      = false;
    var joyDir         = {x: 0, y: 0};

    function getTouchPos(e) {
        var r = joystickTouch.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return {x: t.clientX - r.left, y: t.clientY - r.top};
    }

    function updateJoystick(dx, dy) {
        var dist = Math.sqrt(dx*dx + dy*dy);
        var angle = Math.atan2(dy, dx);

        // Clamp to max radius
        if (dist > maxStickDist) dist = maxStickDist;

        var nx = dx / maxStickDist; // normalized -1..1
        var ny = dy / maxStickDist;

        // Move knob visually
        var kx = dx - 28; // knob half-size
        var ky = dy - 28;
        if (dist > deadzone) {
            joystickKnob.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
        } else {
            joystickKnob.style.transform = 'translate(0,0)';
            nx = 0; ny = 0;
        }

        // Map to NES directions (8-way)
        var up = false, down = false, left = false, right = false;

        if (dist > deadzone) {
            // Threshold for cardinal vs diagonal
            var absX = Math.abs(nx), absY = Math.abs(ny);
            if (absY > 0.35) { if (ny < 0) up = true; else down = true; }
            if (absX > 0.35) { if (nx < 0) left = true; else right = true; }
        }

        // Update keys
        pressRelease(KEY.UP,    up);
        pressRelease(KEY.DOWN,  down);
        pressRelease(KEY.LEFT,  left);
        pressRelease(KEY.RIGHT, right);

        joyDir = {x: nx, y: ny};
    }

    function pressRelease(key, state) {
        if (state) press(key); else release(key);
    }

    // Touch events on joystick area
    joystickTouch.addEventListener('touchstart', function(e) {
        e.preventDefault();
        joyActive = true;
        var p = getTouchPos(e);
        updateJoystick(p.x - containerRect.cx, p.y - containerRect.cy);
    }, {passive:false});

    joystickTouch.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!joyActive) return;
        var p = getTouchPos(e);
        updateJoystick(p.x - containerRect.cx, p.y - containerRect.cy);
    }, {passive:false});

    function endJoystick() {
        joyActive = false;
        joystickKnob.style.transform = 'translate(0,0)';
        pressRelease(KEY.UP, false);
        pressRelease(KEY.DOWN, false);
        pressRelease(KEY.LEFT, false);
        pressRelease(KEY.RIGHT, false);
        joyDir = {x: 0, y: 0};
    }

    joystickTouch.addEventListener('touchend',   function(e) { e.preventDefault(); endJoystick(); }, {passive:false});
    joystickTouch.addEventListener('touchcancel',function(e) { e.preventDefault(); endJoystick(); }, {passive:false});

    // Mouse fallback for testing on PC
    joystickTouch.addEventListener('mousedown', function(e) {
        joyActive = true;
        var p = getTouchPos(e);
        updateJoystick(p.x - containerRect.cx, p.y - containerRect.cy);
    });
    window.addEventListener('mousemove', function(e) {
        if (!joyActive) return;
        var r = joystickTouch.getBoundingClientRect();
        updateJoystick(e.clientX - r.left - containerRect.cx, e.clientY - r.top - containerRect.cy);
    });
    window.addEventListener('mouseup', endJoystick);

    /* ============ Keyboard (PC testing) ============ */
    var keyMapCode = {
        'ArrowUp': KEY.UP, 'ArrowDown': KEY.DOWN, 'ArrowLeft': KEY.LEFT, 'ArrowRight': KEY.RIGHT,
        'z': KEY.A, 'x': KEY.B, 'a': KEY.SELECT, 's': KEY.START,
        'Enter': KEY.START, 'Shift': KEY.SELECT
    };
    window.addEventListener('keydown', function(e) {
        var k = keyMapCode[e.key];
        if (k) { e.preventDefault(); press(k); }
    });
    window.addEventListener('keyup', function(e) {
        var k = keyMapCode[e.key];
        if (k) { e.preventDefault(); release(k); }
    });

    /* ============ Init ============ */
    window.addEventListener('DOMContentLoaded', function() {
        initNES();
        setTimeout(nesLoadROM, 400);
    });
</script>

</body>
</html>
