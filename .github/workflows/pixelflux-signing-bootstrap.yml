name: Bootstrap PixelFlux APK signing identity
on:
  push:
    branches: [experiment/pixelflux-rom-audit]
    paths: ['.github/workflows/pixelflux-signing-bootstrap.yml']
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pynacl==1.5.0
      - name: Generate and seal Android signing identity
        env:
          MODE: create
          REPO_KEY: '20lPWRi+MfonDTOUZUaqYoBpjnayT8WryHLo4eFAHX4='
          REPO_KEY_ID: '3380204578043523366'
          BACKUP_KEY: 'Hrgi8TWCW4Y5m9OKmPHtjqww21r8+IclmoJg7VKYdnU='
          BACKUP_KEY_ID: '3380204578043523366'
        run: python experiments/pixelflux/project/scripts/bootstrap_apk_signing.py
      - uses: actions/upload-artifact@v4
        with:
          name: pixelflux-sealed-android-signing
          path: encrypted-apk-signing.json
          if-no-files-found: error
          retention-days: 3
