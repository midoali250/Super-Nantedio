name: Validate game update manifests
on:
  push:
    paths:
      - 'updates/**'
      - 'tools/validate_updates.py'
      - '.github/workflows/validate-updates.yml'
  pull_request:
    paths:
      - 'updates/**'
      - 'tools/validate_updates.py'
      - '.github/workflows/validate-updates.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and downloadable APK checksum
        env:
          # Releases on a private repository are only served to an
          # authenticated caller, so the download check needs a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_updates.py --check-downloads
