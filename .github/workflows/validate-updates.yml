name: Validate game update manifests
on:
  push:
    paths:
      - 'updates/**'
      - 'tools/validate_updates.py'
      - '.github/workflows/validate-updates.yml'
  pull_request:
    paths:
      - 'updates/**'
      - 'tools/validate_updates.py'
      - '.github/workflows/validate-updates.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and downloadable APK checksum
        run: python3 tools/validate_updates.py --check-downloads
