name: Verify PixelFlux signing backup
on:
  push:
    branches: [experiment/pixelflux-rom-audit]
    paths: ['.github/workflows/pixelflux-backup-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pynacl==1.5.0
      - name: Verify backup matches release certificate
        env:
          MODE: verify
          SIGNING_JSON: ${{ secrets.PIXELFLUX_ANDROID_RELEASE_SIGNING_BACKUP }}
          EXPECTED_FINGERPRINT: c843cd0f098d9a3bd24efe631ce589d4e37b88753a8fbbd19b32ee9f7971f38e
        run: python experiments/pixelflux/project/scripts/bootstrap_apk_signing.py
