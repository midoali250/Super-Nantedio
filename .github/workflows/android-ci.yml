name: Build & test bitvaultengine

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Required so the build job can publish the APK as a release asset.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Everything that can be proven without an Android SDK: the ROM, the wasm
  #    core, the gameplay, the golden frames, the real UI in a DOM and the
  #    packaging tools. The APK job refuses to run if this fails.
  # ---------------------------------------------------------------------------
  test:
    name: Test the game (core, gameplay, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # jsdom 30 needs Node >= 20.19 / 22.12; pin 22 so the DOM tests really run
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the web assets are in sync with the APK assets
        run: |
          ./tools/sync_web_assets.sh
          git diff --exit-code --stat android/app/src/main/assets \
            || (echo "::error::android assets were out of date; run tools/sync_web_assets.sh" && exit 1)

      - name: Check the test toolchain
        run: |
          node --version
          npm --version
          node -e "console.log('jsdom', require('jsdom/package.json').version)"

      - name: Run the test-suite (ROM, core, gameplay, golden frames, UI)
        env:
          REQUIRE_JSDOM: '1'
        run: |
          set -o pipefail
          node tests/run.js 2>&1 | tee /tmp/tests.log
          status=$?
          if [ $status -ne 0 ]; then
            # surface each failure as a GitHub annotation so it is visible without logs
            grep -a '✗' /tmp/tests.log | while read -r line; do
              echo "::error::$line"
            done
            {
              echo "### Failing tests"
              echo '```'
              grep -a -A 3 '✗' /tmp/tests.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi
          exit $status
        continue-on-error: true

      - name: Test report
        if: always()
        run: |
          cp /tmp/tests.log tests-log.txt 2>/dev/null || true
          tail -40 /tmp/tests.log 2>/dev/null || true

      - name: Fail the job if the tests failed
        if: always()
        run: |
          if ! grep -q 'ALL PASSED' /tmp/tests.log 2>/dev/null; then
            echo "::error::the test-suite did not pass"
            # Annotations are readable from the API even when logs are not.
            node --version | sed 's/^/::error::node /' || true
            tail -n 60 /tmp/tests.log 2>/dev/null | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # Debug channel: store the raw test log on a scratch branch so it can be
      # fetched with plain git (artifact/log uploads need blob storage).
      - name: Publish the test log
        if: always()
        continue-on-error: true
        run: |
          cp /tmp/tests.log tests-log.txt 2>/dev/null || echo "no log" > tests-log.txt
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B ci-logs
          git add -f tests-log.txt
          git commit -qm "ci: test log for ${GITHUB_SHA}" || true
          git push -q -f origin ci-logs

      - name: Disassemble the ROM (proves the tooling works)
        run: |
          python3 tools/nes_disassembler.py "roms/Super Mario Bros. + Duck Hunt (E) [!].nes" \
            --output docs/disassembly.txt
          wc -l docs/disassembly.txt

      - name: Emulator screenshots
        run: node tools/capture_screens.js

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots/*.png
            tests-log.txt
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Build the installable APK.
  # ---------------------------------------------------------------------------
  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The runner image already ships the Android SDK; the command line tools
      # let us add the exact platform/build-tools this project targets.
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Sync the tested web assets into the APK
        run: ./tools/sync_web_assets.sh

      - name: Build the release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Install verification dependencies
        run: npm install --no-audit --no-fund

      - name: Name and inspect the APK
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || (echo "::error::the release APK was not produced" && exit 1)
          cp "$SRC" bitvaultengine.apk
          ls -l bitvaultengine.apk
          # the APK must carry the emulator payload
          unzip -l bitvaultengine.apk | grep -q 'assets/index.html'
          unzip -l bitvaultengine.apk | grep -q 'assets/js/vendor/sen_bg.wasm'
          unzip -l bitvaultengine.apk | grep -q 'assets/games/'
          echo "APK contains the emulator, the wasm core and the ROM"

      # Unpacks the finished APK and plays the game from *its own* assets.
      - name: Verify the packaged APK (boots the app from inside it)
        run: node tools/verify_apk.js bitvaultengine.apk

      - uses: actions/upload-artifact@v5
        with:
          name: bitvaultengine-apk
          path: bitvaultengine.apk
          retention-days: 90

      # A permanent download URL:
      #   https://github.com/<owner>/<repo>/releases/latest/download/bitvaultengine.apk
      - name: Publish the APK as a release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # run_number is monotonic, so "latest" is always the newest build
          TAG="apk-${{ github.run_number }}-${{ github.run_attempt }}"
          SUMMARY=$(grep -a 'ALL PASSED' tests-log.txt 2>/dev/null | tail -1 | sed 's/\x1b\[[0-9;]*m//g' || true)
          cat > notes.md <<EOF
          **Super Mario Bros. + Duck Hunt (E)** — the 3-in-1 cart (Mario, Duck Hunt,
          World Class Track Meet) running on the SEN NES core (WASM).

          * built from commit \`${{ github.sha }}\`
          * tests: ${SUMMARY:-see the CI run}
          * the APK itself was unpacked, byte-compared with the tested sources and
            booted from its own assets before this release (\`tools/verify_apk.js\`)

          **التثبيت على الهاتف:** نزّل \`bitvaultengine.apk\` وثبّته مباشرة — لا حاجة لفك
          الضغط. إن ظهر تحذير «مصادر غير معروفة» اسمح به لتطبيق المتصفح فقط.
          EOF
          gh release create "$TAG" bitvaultengine.apk \
            --title "bitvaultengine $TAG" \
            --notes-file notes.md \
            --latest
          {
            echo "### Download"
            echo "<https://github.com/${{ github.repository }}/releases/latest/download/bitvaultengine.apk>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          {
            echo "## bitvaultengine APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| size | $(du -h bitvaultengine.apk | cut -f1) |"
            echo "| sha256 | \`$(sha256sum bitvaultengine.apk | cut -d' ' -f1)\` |"
            echo "| commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
