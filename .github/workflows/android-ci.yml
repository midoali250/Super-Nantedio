name: Android CI - Build & Test NES Emulator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitvault-engine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Disassemble NES ROM
        run: |
          python3 tools/nes_disassembler.py roms/*.nes --output tools/disassembly_output.txt --summary
          cat tools/disassembly_output.txt

      - name: Upload Disassembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: nes-disassembly
          path: tools/disassembly_output.txt
          retention-days: 30

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: bitvault-engine-debug-apk
          path: ./apk

      - name: Verify APK integrity
        run: |
          if [ ! -f ./apk/app-debug.apk ]; then
            echo "❌ APK file not found!"
            exit 1
          fi
          echo "✅ APK built successfully: $(wc -c < ./apk/app-debug.apk) bytes"

      - name: Validate ROM file exists
        run: |
          if [ ! -f roms/*.nes ]; then
            echo "❌ NES ROM not found!"
            exit 1
          fi
          echo "✅ NES ROM found: $(ls roms/*.nes)"
