name: Android CI - Build APK Only

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      GRADLE_USER_HOME: ~/.gradle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android Command Line Tools
        run: |
          mkdir -p ${ANDROID_HOME}/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d ${ANDROID_HOME}/cmdline-tools
          mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "PATH=${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/build-tools/34.0.0:${PATH}" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.4/bin/gradle /usr/local/bin/gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(wc -c < android/app/build/outputs/apk/debug/app-debug.apk) bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitvault-engine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Disassemble NES ROM
        run: |
          python3 tools/nes_disassembler.py roms/*.nes --output tools/disassembly_output.txt --summary

      - name: Upload Disassembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: nes-disassembly
          path: tools/disassembly_output.txt
          retention-days: 30
