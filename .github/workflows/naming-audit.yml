name: Repository naming audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find old naming in current paths and source
        run: python tools/naming/audit.py
      - name: Audit reachable Git history
        run: python tools/naming/audit_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: naming-audit
          path: brand-audit.json
