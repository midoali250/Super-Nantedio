name: Signed update primitives
on:
  push:
    branches: [engine/clean-foundation]
    paths: ['updates/client/python/**', 'updates/publisher/python/**', '.github/workflows/signed-update-primitives.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography==44.0.3
      - name: Verify signatures, identity, redirects and download integrity
        working-directory: updates/client/python
        run: python -m unittest discover -s tests -v

      - name: Test signed release publisher and client compatibility
        working-directory: updates/publisher/python
        run: python -m unittest discover -s tests -v
