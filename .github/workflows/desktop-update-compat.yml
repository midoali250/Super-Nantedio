name: Desktop legacy update compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            wheel: pygame-2.6.1-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          - os: windows-latest
            wheel: pygame-2.6.1-cp311-cp311-win_amd64.whl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install vendored pygame
        shell: bash
        run: python -m pip install 'desktop/vendor/${{ matrix.wheel }}'
      - name: Run published 1.0.0 updater against current release
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python desktop/common/tests/test_legacy_update.py
