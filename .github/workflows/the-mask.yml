name: SNES The Mask - Android & Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/the-mask/**'
      - 'desktop/the-mask/**'
      - 'tools/publish_the_mask.py'
      - 'updates/client/android/**'
      - '.github/workflows/the-mask.yml'
  pull_request:
    paths:
      - 'games/the-mask/**'
      - 'desktop/the-mask/**'
      - 'tools/publish_the_mask.py'
      - 'updates/client/android/**'
      - '.github/workflows/the-mask.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/the-mask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'ndk;27.0.12077973' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test the virtual pad
        run: |
          mkdir -p /tmp/snes-vpad
          javac -d /tmp/snes-vpad app/src/main/java/com/midoali/snes/{VirtualPad,ScreenMap}.java tools/vpad/VpadTest.java
          java -cp /tmp/snes-vpad com.midoali.snes.VpadTest
      - name: Host core boot and gameplay test
        run: |
          python3 -m pip install Pillow==11.3.0
          cmake -S tools/host -B tools/host/build
          cmake --build tools/host/build -j 2
          python3 tools/host/test_boot.py
      - name: Configure release signing when secrets are available
        env:
          KEY_B64: ${{ secrets.SNES_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.SNES_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNES_SIGNING_ALIAS }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/snes.jks"
            echo "SNES_KEYSTORE_PATH=$RUNNER_TEMP/snes.jks" >> "$GITHUB_ENV"
            echo "SNES_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SNES_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SNES_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build debug and release APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/aapt" dump badging "$APK" | grep "package: name='com.midoali.snes.themask' versionCode='1' versionName='1.0'"
          python3 ../../tools/naming/verify_apks.py "$APK"
          cp "$APK" The-Mask-SNES-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: the-mask-android
          path: games/the-mask/The-Mask-SNES-1.0.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build SNES host core DLL
        shell: msys2 {0}
        run: |
          cmake -S desktop/the-mask -B desktop/the-mask/native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/the-mask/native-build
      - name: Install pinned runtime and packager
        shell: pwsh
        run: |
          $wheel = Get-ChildItem desktop/vendor/*win_amd64.whl | Select-Object -First 1
          if ((Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower() -ne '91476902426facd4bb0dad4dc3b2573bc82c95c71b135e0daaea072ed528d299') { throw 'pygame wheel checksum mismatch' }
          python -m pip install setuptools==69.5.1
          python -m pip install $wheel.FullName pyinstaller==6.12.0
      - name: Test and package portable EXE
        shell: pwsh
        run: |
          $dll = (Get-ChildItem desktop/the-mask/native-build -Filter '*snesapp_host.dll' -Recurse | Select-Object -First 1).FullName
          if (!$dll) { throw 'Missing native core DLL' }
          Copy-Item $dll desktop/the-mask/
          Copy-Item games/the-mask/app/src/main/assets/themask.sfc desktop/the-mask/themask.sfc
          $env:SDL_VIDEODRIVER='dummy'; $env:SDL_AUDIODRIVER='dummy'
          python desktop/the-mask/tests/test_input.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/the-mask/app.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name The-Mask-Windows-x64 --icon desktop/the-mask/icon.ico --add-binary "$dll;." --add-data "desktop/the-mask/themask.sfc;." --add-data "desktop/the-mask/icon.png;." desktop/the-mask/app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/the-mask/tests/smoke.ps1 -Executable (Resolve-Path dist/The-Mask-Windows-x64.exe).Path
      - uses: actions/upload-artifact@v4
        with:
          name: The-Mask-Windows-x64
          path: dist/The-Mask-Windows-x64.exe
          if-no-files-found: error

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify architecture
        shell: bash
        run: |
          case '${{ matrix.platform }}' in linux) test "$(uname -m)" = x86_64 ;; macos) test "$(uname -m)" = arm64 ;; esac
      - name: Install build dependencies
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then sudo apt-get update && sudo apt-get install -y libfuse2; fi
          if [ '${{ matrix.platform }}' = linux ]; then
            wheel=$(find desktop/vendor -name '*manylinux*x86_64.whl')
            echo 'ce8cc108b92de9b149b344ad2e25eedbe773af0dc41dfb24d1f07f679b558c60  '"$wheel" | shasum -a 256 -c -
          else
            wheel=$(find desktop/vendor -name '*macosx*arm64.whl')
            echo 'f3935459109da4bb0b3901da9904f0a3e52028a3332a355d298b1673a334cf21  '"$wheel" | shasum -a 256 -c -
          fi
          python -m pip install setuptools==69.5.1
          python -m pip install "$wheel" pyinstaller==6.12.0
      - name: Build core and test input/gameplay
        shell: bash
        run: |
          cmake -S desktop/the-mask -B desktop/the-mask/native-build -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/the-mask/native-build -j 2
          if [ '${{ matrix.platform }}' = linux ]; then lib=desktop/the-mask/native-build/libsnesapp_host.so; else lib=desktop/the-mask/native-build/libsnesapp_host.dylib; fi
          cp "$lib" desktop/the-mask/
          cp games/the-mask/app/src/main/assets/themask.sfc desktop/the-mask/themask.sfc
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python desktop/the-mask/tests/test_input.py
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python desktop/the-mask/app.py --self-test
      - name: Package and test Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name TheMask --add-binary 'desktop/the-mask/native-build/libsnesapp_host.so:.' --add-data 'desktop/the-mask/themask.sfc:.' --add-data 'desktop/the-mask/icon.png:.' desktop/the-mask/app.py
          mkdir -p AppDir/usr/bin
          cp -a dist/TheMask/. AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/TheMask" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=SNES: The Mask\nExec=TheMask\nIcon=themask\nCategories=Game;\n' > AppDir/themask.desktop
          cp desktop/the-mask/icon.png AppDir/themask.png
          curl -fL --retry 3 -o /tmp/appimagetool 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir The-Mask-Linux-x86_64.AppImage
          chmod +x The-Mask-Linux-x86_64.AppImage
          THE_MASK_UI_SCREENSHOT="$PWD/the-mask-ui-controls.png" bash desktop/the-mask/tests/smoke_linux.sh "$PWD/The-Mask-Linux-x86_64.AppImage"
      - name: Package and test macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name TheMask --icon desktop/the-mask/icon.icns --add-binary 'desktop/the-mask/native-build/libsnesapp_host.dylib:.' --add-data 'desktop/the-mask/themask.sfc:.' --add-data 'desktop/the-mask/icon.png:.' desktop/the-mask/app.py
          bash desktop/the-mask/tests/smoke_macos.sh "$PWD/dist/TheMask.app"
          ditto -c -k --sequesterRsrc --keepParent dist/TheMask.app The-Mask-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: The-Mask-${{ matrix.platform }}-${{ matrix.arch }}
          path: The-Mask-${{ matrix.platform == 'linux' && 'Linux-x86_64.AppImage' || 'macOS-arm64.zip' }}
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [android, windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/mask-artifacts
      - name: Publish GitHub Releases, update manifests and RELEASE-ARCHIVE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          APK="/tmp/mask-artifacts/the-mask-android/The-Mask-SNES-1.0.apk"
          WIN="/tmp/mask-artifacts/The-Mask-Windows-x64/The-Mask-Windows-x64.exe"
          LIN="/tmp/mask-artifacts/The-Mask-linux-x86_64/The-Mask-Linux-x86_64.AppImage"
          MAC="/tmp/mask-artifacts/The-Mask-macos-arm64/The-Mask-macOS-arm64.zip"
          chmod +x "$LIN"

          if gh release view the-mask-v1.0 >/dev/null 2>&1; then
            gh release upload the-mask-v1.0 "$APK" --clobber
          else
            gh release create the-mask-v1.0 "$APK" \
              --title "SNES: The Mask 1.0 (Android)" \
              --notes "الإصدار 1.0 للعبة The Mask (SNES) على أندرويد مع أيقونة مخصصة ودعم التحديثات التلقائية."
          fi

          if gh release view the-mask-desktop-v1.0.0 >/dev/null 2>&1; then
            gh release upload the-mask-desktop-v1.0.0 "$WIN" "$LIN" "$MAC" --clobber
          else
            gh release create the-mask-desktop-v1.0.0 "$WIN" "$LIN" "$MAC" \
              --title "SNES: The Mask Desktop 1.0.0 (Windows / Linux / macOS)" \
              --notes "الإصدار 1.0.0 لسطح المكتب للعبة The Mask (SNES): Windows Portable EXE و Linux AppImage و macOS arm64 App."
          fi

          python3 tools/publish_the_mask.py
          python3 tools/validate_updates.py

          git config user.name "BitVaultEngine CI"
          git config user.email "ci@users.noreply.github.com"
          git add updates/games/the-mask.json updates/desktop/the-mask.json RELEASE-ARCHIVE/
          python3 tools/naming/audit.py
          rm -f brand-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive The Mask (SNES) v1.0 binaries and update SHA-256 manifests"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
