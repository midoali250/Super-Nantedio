name: Validate signed Android builds
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: super-mario-world-apks
          run-id: 41817181525
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/world
      - uses: actions/download-artifact@v4
        with:
          name: nes-mario-duckhunt-release
          run-id: 41817730057
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ducks
      - uses: actions/download-artifact@v4
        with:
          name: nes-emulator-release-apk
          run-id: 41817730134
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/emulator
      - name: Verify packages, signing and content
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world/release/app-release.apk"
          ducks="$RUNNER_TEMP/ducks/app-release.apk"
          emu="$RUNNER_TEMP/emulator/app-release.apk"
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          for f in "$world" "$ducks" "$emu"; do
            "$SDK/apksigner" verify --verbose --print-certs "$f"
            "$SDK/aapt" dump badging "$f" | head -3
          done
          "$SDK/aapt" dump badging "$world" | grep "package: name='com.midoali.supermarioworld' versionCode='5' versionName='1.4'"
          "$SDK/aapt" dump badging "$ducks" | grep "package: name='com.midoali.nes' versionCode='4' versionName='1.3'"
          "$SDK/aapt" dump badging "$emu" | grep "package: name='com.bitvaultengine.nes' versionCode='2' versionName='1.1'"
          python tools/naming/verify_apks.py "$world" "$ducks" "$emu"
