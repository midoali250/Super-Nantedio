name: Super Mario World NES - Android
on:
  push:
    branches: [main]
    paths:
      - 'games/super-mario-world/**'
      - 'updates/client/android/**'
      - '.github/workflows/super-mario-world.yml'
  pull_request:
    paths:
      - 'games/super-mario-world/**'
      - 'updates/client/android/**'
      - '.github/workflows/super-mario-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/super-mario-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'ndk;27.0.12077973' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test virtual pad and game core
        run: |
          python3 -m pip install Pillow==11.3.0
          mkdir -p /tmp/world-vpad
          javac -d /tmp/world-vpad app/src/main/java/com/midoali/nes/{VirtualPad,Zapper,ScreenMap}.java tools/vpad/VpadTest.java
          java -cp /tmp/world-vpad com.midoali.nes.VpadTest
          cmake -S tools/host -B tools/host/build
          cmake --build tools/host/build -j 2
          python3 tools/host/test_world_gameplay.py
          python3 tools/host/test_lives.py
          python3 tools/host/test_protection.py
          python3 tools/host/test_enemy_collision.py 0
          python3 tools/host/test_enemy_collision.py 2
      - name: Configure release signing when secrets are available
        env:
          KEY_B64: ${{ secrets.WORLD_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.WORLD_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORLD_SIGNING_ALIAS }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/world.jks"
            echo "NES_KEYSTORE_PATH=$RUNNER_TEMP/world.jks" >> "$GITHUB_ENV"
            echo "NES_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NES_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "NES_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: super-mario-world-apks
          path: games/super-mario-world/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
