name: NES Mario + Duck Hunt
on:
  push:
    branches: [ main ]
    paths:
      - 'games/nes-mario-duckhunt/**'
      - '.github/workflows/nes-mario-duckhunt.yml'
  pull_request:
    paths:
      - 'games/nes-mario-duckhunt/**'
      - '.github/workflows/nes-mario-duckhunt.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/nes-mario-duckhunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'ndk;27.0.12077973' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test controls
        run: |
          mkdir -p /tmp/nes-vpad-test
          javac -d /tmp/nes-vpad-test app/src/main/java/com/midoali/nes/{VirtualPad,Zapper,ScreenMap}.java tools/vpad/VpadTest.java
          java -cp /tmp/nes-vpad-test com.midoali.nes.VpadTest
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nes-mario-duckhunt-debug
          path: games/nes-mario-duckhunt/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
