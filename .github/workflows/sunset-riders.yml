name: Sunset Riders (رعاة البقر) - Android & Desktop
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'games/sunset-riders/**'
      - 'desktop/sunset-riders/**'
      - 'tools/publish_sunset_riders.py'
      - 'updates/client/android/**'
      - '.github/workflows/sunset-riders.yml'
  pull_request:
    paths:
      - 'games/sunset-riders/**'
      - 'desktop/sunset-riders/**'
      - 'tools/publish_sunset_riders.py'
      - 'updates/client/android/**'
      - '.github/workflows/sunset-riders.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/sunset-riders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'ndk;27.0.12077973' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test the virtual pad
        run: |
          mkdir -p /tmp/snes-vpad
          javac -d /tmp/snes-vpad app/src/main/java/com/midoali/snes/{VirtualPad,ScreenMap}.java tools/vpad/VpadTest.java
          java -cp /tmp/snes-vpad com.midoali.snes.VpadTest
      - name: Host core boot and gameplay test
        run: |
          python3 -m pip install Pillow==11.3.0
          cmake -S tools/host -B tools/host/build
          cmake --build tools/host/build -j 2
          python3 tools/host/test_boot.py
      - name: Configure release signing when secrets are available
        env:
          KEY_B64: ${{ secrets.SNES_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.SNES_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNES_SIGNING_ALIAS }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/snes.jks"
            echo "SNES_KEYSTORE_PATH=$RUNNER_TEMP/snes.jks" >> "$GITHUB_ENV"
            echo "SNES_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SNES_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SNES_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build debug and release APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/aapt" dump badging "$APK" | grep "package: name='com.midoali.snes.sunsetriders' versionCode='2' versionName='1.1'"
          python3 ../../tools/naming/verify_apks.py "$APK"
          cp "$APK" Sunset-Riders-1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sunset-riders-android
          path: games/sunset-riders/Sunset-Riders-1.1.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build Sunset Riders host core DLL
        shell: msys2 {0}
        run: |
          cmake -S desktop/sunset-riders -B desktop/sunset-riders/native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/sunset-riders/native-build
      - name: Install pinned runtime and packager
        shell: pwsh
        run: |
          $wheel = Get-ChildItem desktop/vendor/*win_amd64.whl | Select-Object -First 1
          if ((Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower() -ne '91476902426facd4bb0dad4dc3b2573bc82c95c71b135e0daaea072ed528d299') { throw 'pygame wheel checksum mismatch' }
          python -m pip install setuptools==69.5.1
          python -m pip install $wheel.FullName pyinstaller==6.12.0
      - name: Test and package portable EXE
        shell: pwsh
        run: |
          $dll = (Get-ChildItem desktop/sunset-riders/native-build -Filter '*snesapp_host.dll' -Recurse | Select-Object -First 1).FullName
          if (!$dll) { throw 'Missing native core DLL' }
          Copy-Item $dll desktop/sunset-riders/
          Copy-Item games/sunset-riders/app/src/main/assets/sunsetriders.bin desktop/sunset-riders/sunsetriders.bin
          $env:SDL_VIDEODRIVER='dummy'; $env:SDL_AUDIODRIVER='dummy'
          python desktop/sunset-riders/tests/test_input.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/sunset-riders/app.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Sunset-Riders-Windows-x64 --icon desktop/sunset-riders/icon.ico --add-binary "$dll;." --add-data "desktop/sunset-riders/sunsetriders.bin;." --add-data "desktop/sunset-riders/icon.png;." desktop/sunset-riders/app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/sunset-riders/tests/smoke.ps1 -Executable (Resolve-Path dist/Sunset-Riders-Windows-x64.exe).Path
      - uses: actions/upload-artifact@v4
        with:
          name: Sunset-Riders-Windows-x64
          path: dist/Sunset-Riders-Windows-x64.exe
          if-no-files-found: error

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify architecture
        shell: bash
        run: |
          case '${{ matrix.platform }}' in linux) test "$(uname -m)" = x86_64 ;; macos) test "$(uname -m)" = arm64 ;; esac
      - name: Install build dependencies
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then sudo apt-get update && sudo apt-get install -y libfuse2; fi
          if [ '${{ matrix.platform }}' = linux ]; then
            wheel=$(find desktop/vendor -name '*manylinux*x86_64.whl')
            echo 'ce8cc108b92de9b149b344ad2e25eedbe773af0dc41dfb24d1f07f679b558c60  '"$wheel" | shasum -a 256 -c -
          else
            wheel=$(find desktop/vendor -name '*macosx*arm64.whl')
            echo 'f3935459109da4bb0b3901da9904f0a3e52028a3332a355d298b1673a334cf21  '"$wheel" | shasum -a 256 -c -
          fi
          python -m pip install setuptools==69.5.1
          python -m pip install "$wheel" pyinstaller==6.12.0
      - name: Build core and test input/gameplay
        shell: bash
        run: |
          cmake -S desktop/sunset-riders -B desktop/sunset-riders/native-build -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/sunset-riders/native-build -j 2
          if [ '${{ matrix.platform }}' = linux ]; then lib=desktop/sunset-riders/native-build/libsnesapp_host.so; else lib=desktop/sunset-riders/native-build/libsnesapp_host.dylib; fi
          cp "$lib" desktop/sunset-riders/
          cp games/sunset-riders/app/src/main/assets/sunsetriders.bin desktop/sunset-riders/sunsetriders.bin
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python desktop/sunset-riders/tests/test_input.py
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python desktop/sunset-riders/app.py --self-test
      - name: Package and test Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name SunsetRiders --add-binary 'desktop/sunset-riders/native-build/libsnesapp_host.so:.' --add-data 'desktop/sunset-riders/sunsetriders.bin:.' --add-data 'desktop/sunset-riders/icon.png:.' desktop/sunset-riders/app.py
          mkdir -p AppDir/usr/bin
          cp -a dist/SunsetRiders/. AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/SunsetRiders" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=Sunset Riders\nExec=SunsetRiders\nIcon=sunsetriders\nCategories=Game;\n' > AppDir/sunsetriders.desktop
          cp desktop/sunset-riders/icon.png AppDir/sunsetriders.png
          curl -fL --retry 3 -o /tmp/appimagetool 'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage'
          echo '62aebc77c2149e96b593b94da9bbd1881e0984a56399ff6d7a03b7ddd7c9ce68  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir Sunset-Riders-Linux-x86_64.AppImage
          chmod +x Sunset-Riders-Linux-x86_64.AppImage
          SUNSET_RIDERS_UI_SCREENSHOT="$PWD/sunset-riders-ui-cheats.png" bash desktop/sunset-riders/tests/smoke_linux.sh "$PWD/Sunset-Riders-Linux-x86_64.AppImage"
      - name: Package and test macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SunsetRiders --icon desktop/sunset-riders/icon.icns --add-binary 'desktop/sunset-riders/native-build/libsnesapp_host.dylib:.' --add-data 'desktop/sunset-riders/sunsetriders.bin:.' --add-data 'desktop/sunset-riders/icon.png:.' desktop/sunset-riders/app.py
          bash desktop/sunset-riders/tests/smoke_macos.sh "$PWD/dist/SunsetRiders.app"
          ditto -c -k --sequesterRsrc --keepParent dist/SunsetRiders.app Sunset-Riders-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sunset-Riders-${{ matrix.platform }}-${{ matrix.arch }}
          path: Sunset-Riders-${{ matrix.platform == 'linux' && 'Linux-x86_64.AppImage' || 'macOS-arm64.zip' }}
          if-no-files-found: error

  publish:
    # Releases and update manifests are only published from main: a branch build
    # would otherwise re-upload a byte-different APK and leave the manifest in
    # main pointing at a stale SHA-256.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/sr-artifacts
      - name: Publish GitHub Releases, update manifests and RELEASE-ARCHIVE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="/tmp/sr-artifacts/sunset-riders-android/Sunset-Riders-1.1.apk"
          WIN="/tmp/sr-artifacts/Sunset-Riders-Windows-x64/Sunset-Riders-Windows-x64.exe"
          LIN="/tmp/sr-artifacts/Sunset-Riders-linux-x86_64/Sunset-Riders-Linux-x86_64.AppImage"
          MAC="/tmp/sr-artifacts/Sunset-Riders-macos-arm64/Sunset-Riders-macOS-arm64.zip"
          chmod +x "$LIN"

          if gh release view sunset-riders-v1.1 >/dev/null 2>&1; then
            gh release upload sunset-riders-v1.1 "$APK" --clobber
          else
            gh release create sunset-riders-v1.1 "$APK" \
              --title "رعاة البقر — Sunset Riders 1.1 (Android)" \
              --notes "الإصدار 1.1: صور بألوان زاهية مشبعة وساطعة (Vibrant Arcade Color LUT + Gamma) مع تكبير 4x Scale4x فائق الوضوح (1024×896) بدون أي تمويه، وإزالة تشويش السماء/التدرجات بدقة، وصوت ستيريو نقي 60 إطار/ثانية، وشاشة عريضة، وعصاية تحكم حرة 360°، وزر Reset Game."
          fi

          if gh release view sunset-riders-desktop-v1.1.0 >/dev/null 2>&1; then
            gh release upload sunset-riders-desktop-v1.1.0 "$WIN" "$LIN" "$MAC" --clobber
          else
            gh release create sunset-riders-desktop-v1.1.0 "$WIN" "$LIN" "$MAC" \
              --title "رعاة البقر — Sunset Riders Desktop 1.1.0 (Windows / Linux / macOS)" \
              --notes "الإصدار 1.1.0 لسطح المكتب: Windows Portable EXE و Linux AppImage و macOS arm64 App بجودة صورة True HD 4x Scale4x (1024×896) وألوان زاهية مشبعة (Vibrant Arcade Color LUT)، مع زر Reset Game."
          fi

          python3 tools/publish_sunset_riders.py
          python3 tools/validate_updates.py

          git config user.name "BitVaultEngine CI"
          git config user.email "ci@users.noreply.github.com"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git checkout d54a58c -- RELEASE-ARCHIVE/Windows/1.4.0 RELEASE-ARCHIVE/Linux/1.4.0 RELEASE-ARCHIVE/macOS/1.4.0 RELEASE-ARCHIVE/Windows/The-Mask RELEASE-ARCHIVE/Linux/The-Mask RELEASE-ARCHIVE/macOS/The-Mask || true
            git add updates/games/sunset-riders.json updates/desktop/sunset-riders.json RELEASE-ARCHIVE/
          else
            git checkout HEAD -- RELEASE-ARCHIVE/Android/Sunset-Riders/1.1/Sunset-Riders-1.1.apk RELEASE-ARCHIVE/Windows/Sunset-Riders/1.1.0/Sunset-Riders-Windows-x64.exe RELEASE-ARCHIVE/Linux/Sunset-Riders/1.1.0/Sunset-Riders-Linux-x86_64.AppImage RELEASE-ARCHIVE/macOS/Sunset-Riders/1.1.0/Sunset-Riders-macOS-arm64.zip || true
            git add updates/games/sunset-riders.json updates/desktop/sunset-riders.json RELEASE-ARCHIVE/Android/Sunset-Riders/1.1/SHA256SUMS.txt RELEASE-ARCHIVE/Windows/Sunset-Riders/1.1.0/SHA256SUMS.txt RELEASE-ARCHIVE/Linux/Sunset-Riders/1.1.0/SHA256SUMS.txt RELEASE-ARCHIVE/macOS/Sunset-Riders/1.1.0/SHA256SUMS.txt
          fi
          python3 tools/naming/audit.py
          rm -f brand-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Sunset Riders (رعاة البقر) v1.1 vibrant 4x binaries and update SHA-256 manifests"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
