name: Super Mario World Desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'games/super-mario-world/app/src/main/cpp/**'
      - 'games/super-mario-world/app/src/main/assets/**'
      - '.github/workflows/super-mario-world-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build game core
        shell: msys2 {0}
        run: |
          cmake -S desktop/common -B desktop/native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/native-build
      - name: Install pinned runtime and packager
        shell: pwsh
        run: |
          $wheel = Get-ChildItem desktop/vendor/*win_amd64.whl | Select-Object -First 1
          if ((Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower() -ne '91476902426facd4bb0dad4dc3b2573bc82c95c71b135e0daaea072ed528d299') { throw 'pygame wheel checksum mismatch' }
          python -m pip install setuptools==69.5.1
          python -m pip install $wheel.FullName pyinstaller==6.12.0
      - name: Test and package portable EXE
        shell: pwsh
        run: |
          $dll = (Get-ChildItem desktop/native-build -Filter '*nesapp_host.dll' -Recurse | Select-Object -First 1).FullName
          if (!$dll) { throw 'Missing native core DLL' }
          Copy-Item $dll desktop/common/
          Copy-Item games/super-mario-world/app/src/main/assets/mario.nes desktop/common/mario.nes
          $env:SDL_VIDEODRIVER='dummy'; $env:SDL_AUDIODRIVER='dummy'
          python desktop/common/tests/test_input.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/common/app.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Super-Mario-World-Windows-x64 --add-binary "$dll;." --add-data "desktop/common/mario.nes;." desktop/common/app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/windows/tests/smoke.ps1 -Executable (Resolve-Path dist/Super-Mario-World-Windows-x64.exe).Path
      - uses: actions/upload-artifact@v4
        with:
          name: Super-Mario-World-Windows-x64
          path: dist/Super-Mario-World-Windows-x64.exe
          if-no-files-found: error
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify architecture
        shell: bash
        run: |
          case '${{ matrix.platform }}' in linux) test "$(uname -m)" = x86_64 ;; macos) test "$(uname -m)" = arm64 ;; esac
      - name: Install build dependencies
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then sudo apt-get update && sudo apt-get install -y libfuse2; fi
          if [ '${{ matrix.platform }}' = linux ]; then
            wheel=$(find desktop/vendor -name '*manylinux*x86_64.whl')
            echo 'ce8cc108b92de9b149b344ad2e25eedbe773af0dc41dfb24d1f07f679b558c60  '"$wheel" | shasum -a 256 -c -
          else
            wheel=$(find desktop/vendor -name '*macosx*arm64.whl')
            echo 'f3935459109da4bb0b3901da9904f0a3e52028a3332a355d298b1673a334cf21  '"$wheel" | shasum -a 256 -c -
          fi
          python -m pip install setuptools==69.5.1
          python -m pip install "$wheel" pyinstaller==6.12.0
      - name: Build core and test input/gameplay
        shell: bash
        run: |
          cmake -S desktop/common -B desktop/native-build -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/native-build -j 2
          if [ '${{ matrix.platform }}' = linux ]; then lib=desktop/native-build/libnesapp_host.so; else lib=desktop/native-build/libnesapp_host.dylib; fi
          cp "$lib" desktop/common/
          cp games/super-mario-world/app/src/main/assets/mario.nes desktop/common/mario.nes
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python desktop/common/tests/test_input.py
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python desktop/common/app.py --self-test
      - name: Package and test Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name MarioWorld --add-binary 'desktop/native-build/libnesapp_host.so:.' --add-data 'desktop/common/mario.nes:.' desktop/common/app.py
          mkdir -p AppDir/usr/bin
          cp -a dist/MarioWorld/. AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/MarioWorld" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=Super Mario World\nExec=MarioWorld\nIcon=marioworld\nCategories=Game;\n' > AppDir/marioworld.desktop
          python desktop/linux/create_icon.py AppDir/marioworld.png
          curl -fL --retry 3 -o /tmp/appimagetool 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir Super-Mario-World-Linux-x86_64.AppImage
          chmod +x Super-Mario-World-Linux-x86_64.AppImage
          MARIO_UI_SCREENSHOT="$PWD/ui-controls.png" bash desktop/linux/tests/smoke.sh "$PWD/Super-Mario-World-Linux-x86_64.AppImage"
      - name: Package and test macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name MarioWorld --add-binary 'desktop/native-build/libnesapp_host.dylib:.' --add-data 'desktop/common/mario.nes:.' desktop/common/app.py
          bash desktop/macos/tests/smoke.sh "$PWD/dist/MarioWorld.app"
          ditto -c -k --sequesterRsrc --keepParent dist/MarioWorld.app Super-Mario-World-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Super-Mario-World-${{ matrix.platform }}-${{ matrix.arch }}
          path: Super-Mario-World-${{ matrix.platform == 'linux' && 'Linux-x86_64.AppImage' || 'macOS-arm64.zip' }}
          if-no-files-found: error

      - name: Upload UI test screenshot
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-test-screenshot
          path: ui-controls.png
          if-no-files-found: error
