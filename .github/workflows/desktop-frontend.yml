name: Desktop frontend foundation checks
on:
  push:
    branches: [engine/clean-foundation]
    paths: ['engine/desktop/**', '.github/workflows/desktop-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pygame==2.6.1 pillow==11.1.0
      - name: Test shared frontend without game content
        working-directory: engine/desktop
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        working-directory: engine/desktop
        run: python -m compileall -q .
