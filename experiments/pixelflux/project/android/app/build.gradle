plugins { id 'com.android.application' }
android {
 namespace 'com.bitvaultengine.retrocollection'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'com.pixelflux.app'
  minSdk 26
  targetSdk 35
  versionCode 4
  versionName '1.3'
  ndk { abiFilters 'arm64-v8a','x86_64' }
 }
 if (System.getenv('PIXEL_RELEASE_KEYSTORE')) {
  signingConfigs { release { storeFile file(System.getenv('PIXEL_RELEASE_KEYSTORE')); storePassword System.getenv('PIXEL_RELEASE_STORE_PASSWORD'); keyAlias System.getenv('PIXEL_RELEASE_KEY_ALIAS'); keyPassword System.getenv('PIXEL_RELEASE_KEY_PASSWORD') } }
  buildTypes { release { signingConfig signingConfigs.release } }
 }
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 packagingOptions { jniLibs { useLegacyPackaging true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
